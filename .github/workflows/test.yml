name: CI-CD Pipeline Exp-20

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        cd Backend/exp-20
        pip install -r requirements.txt

    - name: Run Backend Tests
      run: |
        cd Backend/exp-20
        pytest

    - name: Build Docker Image
      run: |
        cd Backend/exp-20
        docker build -t exp20-app .

    - name: Run Docker Container
      run: |
        docker run -d -p 5000:5000 exp20-app